version: "3.8"

services:
  # MongoDB database instance shared by both applications
  mongodb:
    image: mongo:6.0
    container_name: multi-app-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - multi-app-network

  # app-1 (Remote Micro-Frontend)
  app1-remote:
    build:
      context: ./app-1
      dockerfile: Dockerfile
      args:
        # In Docker Compose, the remote serves its own assets on its app port (4000)
        PUBLIC_PATH: "http://localhost:4000/"
    container_name: multi-app-remote-app1
    ports:
      - "4000:4000"
    depends_on:
      - mongodb
    environment:
      - PORT=4000
      - ROOT_URL=http://localhost:4000
      - MONGO_URL=mongodb://mongodb:27017/shared-db
      # Configures DDP to connect to itself locally when running standalone
      - METEOR_SETTINGS={"public":{"remoteServerUrl":"http://localhost:4000"}}
    networks:
      - multi-app-network

  # main (Host Application Shell)
  main-host:
    build:
      context: ./main
      dockerfile: Dockerfile
      args:
        # Tells the host where to load app1's remoteEntry.js at runtime
        REMOTE_APP1_URL: "http://localhost:4000"
    container_name: multi-app-host-main
    ports:
      - "3000:3000"
    depends_on:
      - mongodb
      - app1-remote
    environment:
      - PORT=3000
      - ROOT_URL=http://localhost:3000
      - MONGO_URL=mongodb://mongodb:27017/shared-db
      # Configures DDP to connect to the app-1 container backend
      - METEOR_SETTINGS={"public":{"remoteServerUrl":"http://localhost:4000"}}
    networks:
      - multi-app-network

networks:
  multi-app-network:
    name: multi-app-net
    driver: bridge

volumes:
  mongo-data:
    driver: local
